<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập & Đăng ký - Chat App</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); height: 100vh; display: flex; justify-content: center; align-items: center; }
        .container { background: #fff; width: 380px; padding: 40px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2); }
        .form-box h2 { text-align: center; color: #333; margin-bottom: 25px; font-size: 24px; }
        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; margin-bottom: 8px; color: #555; font-size: 14px; }
        .input-group input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; outline: none; }
        .input-group input:focus { border-color: #667eea; box-shadow: 0 0 5px rgba(102, 126, 234, 0.3); }
        .btn { width: 100%; padding: 12px; background: #667eea; border: none; border-radius: 6px; color: #fff; font-size: 16px; font-weight: bold; cursor: pointer; }
        .btn:hover { background: #5a6fd6; }
        .switch-text { text-align: center; margin-top: 20px; font-size: 14px; color: #666; }
        .switch-text span { color: #667eea; cursor: pointer; font-weight: bold; }
        .switch-text span:hover { text-decoration: underline; }
        .hidden { display: none; }
        #message { text-align: center; margin-top: 15px; font-size: 20px; font-weight: 500; }
    </style>
</head>
<body>
    <div class="container">
        <!-- ĐĂNG NHẬP -->
        <div id="login-box" class="form-box">
            <h2>Đăng Nhập</h2>
            <form id="login-form">
                <div class="input-group">
                    <label>Tên đăng nhập</label>
                    <input type="text" id="login-username" required placeholder="Nhập username...">
                </div>
                <div class="input-group">
                    <label>Mật khẩu</label>
                    <input type="password" id="login-password" required placeholder="Nhập mật khẩu...">
                </div>
                <button type="submit" class="btn">Đăng Nhập</button>
            </form>
            <div class="switch-text">Chưa có tài khoản? <span onclick="switchForm('register')">Đăng ký ngay</span></div>
        </div>

        <!-- ĐĂNG KÝ -->
        <div id="register-box" class="form-box hidden">
            <h2>Đăng Ký</h2>
            <form id="register-form">
                <div class="input-group">
                    <label>Tên đăng nhập</label>
                    <input type="text" id="register-username" required placeholder="Chọn username...">
                </div>
                <div class="input-group">
                    <label>Mật khẩu</label>
                    <input type="password" id="register-password" required placeholder="Chọn mật khẩu...">
                </div>
                <button type="submit" class="btn">Đăng Ký</button>
            </form>
            <div class="switch-text">Đã có tài khoản? <span onclick="switchForm('login')">Đăng nhập</span></div>
        </div>

        <div id="message"></div>
    </div>

    <script>
        const API_URL = "https://chatserver-7mdd.onrender.com";

        function switchForm(type) {
            const loginBox = document.getElementById('login-box');
            const registerBox = document.getElementById('register-box');
            document.getElementById('message').innerText = '';

            if (type === 'register') {
                loginBox.classList.add('hidden');
                registerBox.classList.remove('hidden');
            } else {
                registerBox.classList.add('hidden');
                loginBox.classList.remove('hidden');
            }
        }

        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('register-username').value;
            const password = document.getElementById('register-password').value;
            const msgEl = document.getElementById('message');

            try {
                const res = await fetch(`${API_URL}/api/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                if (res.ok) {
                    msgEl.style.color = 'green';
                    msgEl.innerText = "Đăng ký thành công! Đang chuyển qua đăng nhập...";
                    setTimeout(() => switchForm('login'), 1500);
                } else {
                    msgEl.style.color = 'red';
                    msgEl.innerText = data.error || "Đăng ký thất bại!";
                }
            } catch (err) {
                msgEl.style.color = 'red';
                msgEl.innerText = "Lỗi kết nối server!";
            }
        });

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('login-username').value;
            const password = document.getElementById('login-password').value;
            const msgEl = document.getElementById('message');

            try {
                const res = await fetch(`${API_URL}/api/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                if (res.ok) {
                    msgEl.style.color = 'green';
                    msgEl.innerText = "Đăng nhập thành công! Đang chuyển hướng...";
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('username', username);
                    setTimeout(() => { window.location.href = '/chat'; }, 1000);
                } else {
                    msgEl.style.color = 'red';
                    msgEl.innerText = data.error || "Sai tên đăng nhập hoặc mật khẩu!";
                }
            } catch (err) {
                msgEl.style.color = 'red';
                msgEl.innerText = "Lỗi kết nối server!";
            }
        });
    </script>
</body>
</html>
